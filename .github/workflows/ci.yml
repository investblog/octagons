name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The deck's SVGs are committed (npm and Pages serve them as files), so they must
      # be exactly what the generator produces — an edit to build.mjs without a rebuild
      # would otherwise ship stale cards.
      - name: Deck is up to date with its generator
        run: npm run cards && git diff --exit-code -- cards/svg
      - name: Report size
        run: |
          echo "minified: $(wc -c < octagons.min.js) B"
          echo "gzipped:  $(gzip -9 -c octagons.min.js | wc -c) B"
